; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:custom_stm32h743vih6]
board_build.variants_dir = variants
platform = ststm32
board = stm32h743vih6
upload_protocol = dfu
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
lib_deps = 
	stm32duino/STM32duino LSM6DSO@^2.2.0
	stm32duino/STM32duino STM32SD@^1.5.0
	pfeerick/elapsedMillis@^1.0.6
	stm32duino/STM32duino LPS22HB@^2.0.0
	adafruit/Adafruit NeoPixel@^1.15.5
	aster94/SensorFusion@^1.0.6
	marzogh/SPIMemory@^3.4.0
	natnqweb/Mapf@^1.0.2
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBD_USE_CDC
	-D USBCON
	-D HSE_VALUE=8000000U
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBD_VID=0x0483
	-D USBD_PID=0x5740
	-D USB_MANUFACTURER="\"Custom_H7\""
	-D USB_PRODUCT="\"STM32H743VI\""
	-Og -g3
